name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-host:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cloe-host-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cloe-host-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: cloe-host-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: cloe-host-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        working-directory: native-host
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp native-host/target/${{ matrix.target }}/release/cloe-host ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  package-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test extension and installers
        run: |
          node --test tests/*.test.cjs
          python3 tests/installers.py
          python3 tests/native-host.py

      - name: Package extensions
        run: python3 scripts/package-extension.py

      - name: Validate Firefox extension
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/cloe-extension-firefox --warnings-as-errors

      - uses: actions/upload-artifact@v4
        with:
          name: cloe-extension
          path: dist/*.zip

  release:
    needs: [build-host, package-extension]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/cloe-host-linux-x86_64/cloe-host-linux-x86_64
            artifacts/cloe-host-linux-aarch64/cloe-host-linux-aarch64
            artifacts/cloe-host-macos-x86_64/cloe-host-macos-x86_64
            artifacts/cloe-host-macos-aarch64/cloe-host-macos-aarch64
            artifacts/cloe-extension/cloe-extension.zip
            artifacts/cloe-extension/cloe-extension-firefox.zip
